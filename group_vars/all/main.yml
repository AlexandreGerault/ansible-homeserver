---
# =============================================================================
# Connection
# =============================================================================
homeserver_host: dashboard.homelab.alexandre-gerault.fr
homeserver_user: alexandregerault
ssh_port: 35123

# =============================================================================
# Accounts
# =============================================================================
# Accounts that exist on the managed node and receive an authorized_keys file.
# Their public keys live in vault_ssh_authorized_keys.
authorized_users:
  - alexandregerault

# Extra names kept in sshd's AllowUsers directive, for accounts that exist but
# are not managed here. `alexandre` used to sit in this list without existing in
# /etc/passwd, so it granted nothing; it has been dropped.
ssh_extra_allowed_users: []

docker_users:
  - alexandregerault

jellyfin_users:
  - alexandregerault

# =============================================================================
# System
# =============================================================================
common_timezone: Europe/Paris
common_locale: en_US.UTF-8

# Packages actually installed on the node, beyond the Debian base system.
common_packages:
  # shell comfort
  - bash-completion
  - htop
  - neofetch
  - neovim
  - nano
  - less
  # tooling
  - git
  - jq
  - curl
  - wget
  - unzip
  - plocate
  - lsof
  # networking / diagnostics
  - bind9-dnsutils
  - traceroute
  - netcat-traditional
  # build toolchain (used for the archi-ordinateurs coursework)
  - build-essential
  - gcc-multilib
  - binutils
  - putty
  # firmware
  - intel-microcode
  - firmware-misc-nonfree

# =============================================================================
# Docker
# =============================================================================
# Address container ports are published on. Docker writes its own iptables
# rules, so anything bound to 0.0.0.0 bypasses UFW entirely and is reachable
# from the internet. Everything goes through Caddy, so nothing needs to listen
# anywhere but the loopback.
docker_publish_address: "127.0.0.1"

# Shared network for the media stack. Jellyfin, Homepage, the *arr containers
# and gluetun all join it, so they reach each other by container name instead of
# through Caddy — the SSO sits in front of every vhost and would bounce an API
# call. The subnet is pinned because gluetun's firewall needs it spelled out
# before it will route replies back to a neighbouring docker network.
media_network: media
media_network_subnet: 10.89.0.0/24

docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
  default-address-pools:
    - base: 10.0.0.0/8
      size: 24

# =============================================================================
# Caddy — reverse proxy vhosts, one file per site in /etc/caddy/caddyfiles.d
# =============================================================================
caddy_log_file: /var/log/caddy/access.log

caddy_sites:
  - name: homepage
    domain: dashboard.homelab.alexandre-gerault.fr
    upstream_port: 8097
    protect: true
  - name: jellyfin
    domain: bibliofilm.alexandre-gerault.fr
    upstream_port: 8096
  - name: arbitrageffv
    domain: arbitrageffv.alexandre-gerault.fr
    upstream_port: 8000
  # Keycloak, and oauth2-proxy's callback under /oauth2/ on the same name:
  # Keycloak has no such path, and one name means one DNS record.
  - name: keycloak
    domain: auth.alexandre-gerault.fr
    upstream_port: 8180
    log: true
    routes:
      - path: /oauth2/*
        upstream_port: 4180
  - name: excalidraw
    domain: excalidraw.alexandre-gerault.fr
    upstream_port: 5000
  - name: affine
    domain: affine.alexandre-gerault.fr
    upstream_port: 3010
    log: true
  - name: monitor
    domain: monitor.alexandre-gerault.fr
    upstream_port: 3001
    log: true
    protect: true
  - name: penpot
    domain: penpot.alexandre-gerault.fr
    upstream_port: 9001
    log: true
  - name: scholarsome
    domain: scholarsome.alexandre-gerault.fr
    upstream_port: 4444
    log: true
  - name: qbittorrent
    domain: torrent.alexandre-gerault.fr
    upstream_port: 8099
    log: true
    protect: true
  - name: prowlarr
    domain: prowlarr.alexandre-gerault.fr
    upstream_port: 9696
    log: true
    protect: true
  - name: sonarr
    domain: sonarr.alexandre-gerault.fr
    upstream_port: 8989
    log: true
    protect: true
  - name: radarr
    domain: radarr.alexandre-gerault.fr
    upstream_port: 7878
    log: true
    protect: true
  - name: bazarr
    domain: bazarr.alexandre-gerault.fr
    upstream_port: 6767
    log: true
    protect: true
  # Jellyseerr authenticates against Jellyfin itself, so it is deliberately not
  # behind the SSO: the people who are allowed to request a film already have a
  # Jellyfin account, and putting the portal behind SSO would mean creating a
  # Keycloak account for each of them as well.
  - name: jellyseerr
    domain: requests.alexandre-gerault.fr
    upstream_port: 5055
    log: true
  # Deliberately not `protect: true`. forward_auth answers a request without a
  # session cookie with a redirect to the login portal, which is the right thing
  # for a web interface and the wrong thing for `git clone`, for the API and for
  # every webhook. Forgejo delegates its login page to Keycloak over OpenID
  # Connect instead, so the SSO still guards the browser path.
  - name: forgejo
    domain: git.alexandre-gerault.fr
    upstream_port: 3030
    log: true

# =============================================================================
# Keycloak — SSO. Add `protect: true` to a caddy_sites entry to put it behind
# the login page (through oauth2-proxy); nothing is protected until you do.
# Accounts live in Keycloak's database and are managed in its console.
# =============================================================================
keycloak_domain: auth.alexandre-gerault.fr
keycloak_root_domain: alexandre-gerault.fr
keycloak_port: 8180
keycloak_realm: homeserver
oauth2_proxy_port: 4180
caddy_forward_auth_upstream: "127.0.0.1:4180"

keycloak_groups:
  - "{{ forgejo_oidc_admin_group }}"
# Administrators of the realm, in its own console — not of the master realm,
# whose `admin` account is the role's.
keycloak_realm_admins:
  - alexandregerault

# Applications that log in *through* Keycloak instead of sitting behind
# forward_auth. The secrets are the ones the applications already held when
# Authelia was the provider: Keycloak stores a client secret as it is given.
keycloak_oidc_clients:
  - id: forgejo
    name: Forgejo
    secret: "{{ vault_forgejo_oidc_client_secret }}"
    groups: true
    redirect_uris:
      - "https://git.alexandre-gerault.fr/user/oauth2/keycloak/callback"
  # AFFiNE sends its secret in the form body and always uses PKCE (S256).
  - id: affine
    name: AFFiNE
    secret: "{{ vault_affine_oidc_client_secret }}"
    redirect_uris:
      - "https://affine.alexandre-gerault.fr/oauth/callback"
  # Penpot does not implement PKCE.
  - id: penpot
    name: Penpot
    secret: "{{ vault_penpot_oidc_client_secret }}"
    pkce: false
    redirect_uris:
      - "https://penpot.alexandre-gerault.fr/api/auth/oauth/oidc/callback"

# =============================================================================
# Outgoing mail — one account on the mail server, shared by Keycloak, Forgejo
# and AFFiNE. Its password is vault_smtp_password. Port 465 is TLS from the
# first byte (checked 2026-09-15: Let's Encrypt certificate, AUTH accepted, and
# noreply@ accepted as a sender for this login); 587 with STARTTLS answers too.
# Empty smtp_host puts every consumer back on "no mail".
# =============================================================================
smtp_host: mail.alexandre-gerault.fr
smtp_port: 465
smtp_username: homeserver@alexandre-gerault.fr
smtp_sender: "Homeserver <noreply@alexandre-gerault.fr>"

# =============================================================================
# Jellyfin
# =============================================================================
jellyfin_media_root: /var/jellyfin/media
jellyfin_media_libraries:
  - anime
  - movie
  - music
  - show

# =============================================================================
# qBittorrent — behind gluetun, which holds the OpenVPN tunnel and the killswitch
# =============================================================================
qbittorrent_webui_domain: torrent.alexandre-gerault.fr
qbittorrent_webui_port: 8099
qbittorrent_webui_username: admin
qbittorrent_torrenting_port: 6881

# The VPN is CyberGhost, over OpenVPN, through gluetun's built-in provider. The
# account details are four vault keys; TODO-qbittorrent.md says where they come
# from. The torrenting port above is open in gluetun's firewall on the tunnel
# interface, but CyberGhost forwards no port, so nothing arrives on it — the
# client seeds to the peers it reaches itself, and cannot be reached in turn.
# See "Seeding" in the README.
qbittorrent_openvpn_protocol: udp

# Where the exit node sits. Netherlands because it is close enough for the
# latency not to hurt, and unlike France it is not a jurisdiction to seed from.
# Widen the list to let gluetun fail over to another country when a server is
# full. Names must match gluetun's list, which is not always the obvious one
# ("Czech Republic", "United Kingdom"):
#   docker run --rm qmcgaw/gluetun format-servers -cyberghost
qbittorrent_vpn_server_countries:
  - Netherlands
# Pin one exact host instead, when a country is not specific enough. Empty means
# "anything in the countries above", which is what you want almost always.
qbittorrent_vpn_server_hostnames: []

# =============================================================================
# *arr stack — Prowlarr indexers feeding Sonarr and Radarr, Bazarr for the
# subtitles, Jellyseerr as the request portal. All on the media network, all
# mounting the media tree at the same path so imports are hardlinks.
# =============================================================================
arr_prowlarr_domain: prowlarr.alexandre-gerault.fr
arr_sonarr_domain: sonarr.alexandre-gerault.fr
arr_radarr_domain: radarr.alexandre-gerault.fr
arr_bazarr_domain: bazarr.alexandre-gerault.fr
arr_jellyseerr_domain: requests.alexandre-gerault.fr

# Which library each application manages, as the containers see it. Sonarr gets
# two root folders: pick the anime one when adding a series and set its type to
# Anime, which is what switches it to absolute episode numbering.
arr_root_folders:
  - app: sonarr
    path: /data/show
  - app: sonarr
    path: /data/anime
  - app: radarr
    path: /data/movie

# =============================================================================
# Forgejo — the git forge. Not behind forward_auth: see the caddy_sites comment
# above and roles/forgejo/tasks/main.yml.
# =============================================================================
forgejo_domain: git.alexandre-gerault.fr
forgejo_web_port: 3030

# git+SSH on host port 22, which is free because sshd listens on ssh_port. This
# is the only container port published anywhere but the loopback, and Docker's
# own iptables rules mean UFW does not cover it: what answers there is Forgejo's
# builtin SSH server, key auth only, git commands only, no shell.
forgejo_ssh_enabled: true
forgejo_ssh_publish_address: "0.0.0.0"
forgejo_ssh_port: 22

# Whoever carries this Keycloak group is an administrator in Forgejo. It is
# created by the keycloak role; membership is managed in the Keycloak console.
forgejo_oidc_admin_group: admins

# =============================================================================
# Homepage
# =============================================================================
homepage_config_dir: /etc/homepage/config
homepage_port: 8097

# =============================================================================
# arbitrage_ffv — Laravel app + MySQL, previously launched by hand
# =============================================================================
arbitrage_ffv_network: arbitrage_ffv_network
arbitrage_ffv_image: ghcr.io/thomaslecler/arbitrage_ffv:master
arbitrage_ffv_url: https://arbitrageffv.alexandre-gerault.fr/
arbitrage_ffv_http_port: 8000
arbitrage_ffv_https_port: 4433
arbitrage_ffv_db_name: arbitrage_ffv
arbitrage_ffv_db_user: arbitrage_ffv_laravel
arbitrage_ffv_mysql_image: mysql:8.0
# Anonymous volume created by hand; kept as-is so the data is not lost.
arbitrage_ffv_mysql_volume: d15ca90ceae716632032cd23049bc78005011ac5980cd233923d193bb227fe41

# =============================================================================
# Docker Compose stacks living under ~/apps
# =============================================================================
apps_root: "/home/{{ homeserver_user }}/apps"

compose_apps:
  - name: uptime-kuma
    compose_file: compose.yaml
  - name: penpot
    compose_file: docker-compose.yaml
    env: true
  - name: scholarsome
    compose_file: compose.yml
    env: true
  - name: affine
    compose_file: docker-compose.yml
    env: true
    templates:
      # The OpenID Connect provider. AFFiNE reads config.json from
      # ~/.affine/config, which the compose file mounts from here.
      - src: affine.config.json.j2
        dest: "/home/{{ homeserver_user }}/.affine/self-host/config/config.json"
        owner: root

# What AFFiNE builds the links in its mails from.
affine_external_url: https://affine.alexandre-gerault.fr
