---
# The realm as code, through the admin REST API on the loopback port. Every
# module here compares what is there with what is asked and only writes the
# difference, so a run that changes nothing reports nothing.
#
# Accounts are deliberately not in here: they live in Keycloak's database, are
# managed in its console, and the only ones this role ever writes are the ones
# it takes over from Authelia, once.

- name: Configure the realm
  module_defaults:
    group/community.general.keycloak:
      auth_keycloak_url: "http://{{ docker_publish_address }}:{{ keycloak_port }}"
      auth_realm: master
      auth_client_id: admin-cli
      auth_username: "{{ keycloak_admin_user }}"
      auth_password: "{{ vault_keycloak_admin_password }}"
  block:
    # smtp_sender is "Display Name <address>"; Keycloak wants the two apart.
    - name: Create the realm
      community.general.keycloak_realm:
        id: "{{ keycloak_realm }}"
        realm: "{{ keycloak_realm }}"
        enabled: true
        display_name: "{{ keycloak_realm_display_name }}"
        # Nobody signs themselves up: an administrator creates the account.
        registration_allowed: false
        reset_password_allowed: "{{ smtp_host | length > 0 }}"
        remember_me: true
        login_with_email_allowed: true
        duplicate_emails_allowed: false
        verify_email: false
        ssl_required: external
        internationalization_enabled: true
        supported_locales: "{{ keycloak_supported_locales }}"
        default_locale: "{{ keycloak_default_locale }}"
        sso_session_idle_timeout: "{{ keycloak_sso_session_idle_timeout }}"
        sso_session_max_lifespan: "{{ keycloak_sso_session_max_lifespan }}"
        sso_session_idle_timeout_remember_me: "{{ keycloak_remember_me_lifespan }}"
        sso_session_max_lifespan_remember_me: "{{ keycloak_remember_me_lifespan }}"
        brute_force_protected: true
        permanent_lockout: false
        failure_factor: "{{ keycloak_failure_factor }}"
        max_delta_time_seconds: "{{ keycloak_failure_reset_seconds }}"
        wait_increment_seconds: "{{ keycloak_lockout_seconds }}"
        max_failure_wait_seconds: "{{ keycloak_lockout_seconds }}"
        smtp_server: >-
          {{ {} if smtp_host | length == 0 else {
               'host': smtp_host,
               'port': smtp_port | string,
               'ssl': (smtp_port | int == 465) | string | lower,
               'starttls': (smtp_port | int != 465) | string | lower,
               'auth': 'true',
               'user': smtp_username,
               'password': vault_smtp_password,
               'from': smtp_sender | regex_replace('^.*<(.*)>.*$', '\1'),
               'fromDisplayName': smtp_sender | regex_replace('\s*<.*$', ''),
             } }}
        state: present
      no_log: "{{ keycloak_no_log }}"

    # Keycloak's default profile, with first and last name made optional. Left
    # required, an account without both is stopped at its next login by an
    # "update your profile" form — and Authelia only ever had a display name,
    # which does not always split in two.
    - name: Configure the user profile
      community.general.keycloak_userprofile:
        parent_id: "{{ keycloak_realm }}"
        state: present
        config:
          kc_user_profile_config:
            - attributes:
                - name: username
                  displayName: ${username}
                  validations:
                    length: {min: 3, max: 255}
                    username_prohibited_characters: {}
                    up_username_not_idn_homograph: {}
                  permissions: {view: [admin, user], edit: [admin, user]}
                  multivalued: false
                - name: email
                  displayName: ${email}
                  validations:
                    email: {}
                    length: {max: 255}
                  required: {roles: [user]}
                  permissions: {view: [admin, user], edit: [admin, user]}
                  multivalued: false
                - name: firstName
                  displayName: ${firstName}
                  validations:
                    length: {max: 255}
                    person_name_prohibited_characters: {}
                  permissions: {view: [admin, user], edit: [admin, user]}
                  multivalued: false
                - name: lastName
                  displayName: ${lastName}
                  validations:
                    length: {max: 255}
                    person_name_prohibited_characters: {}
                  permissions: {view: [admin, user], edit: [admin, user]}
                  multivalued: false
              groups:
                - name: user-metadata
                  displayHeader: User metadata
                  displayDescription: Attributes, which refer to user metadata

    - name: Create the groups
      community.general.keycloak_group:
        realm: "{{ keycloak_realm }}"
        name: "{{ item }}"
        state: present
      loop: "{{ keycloak_groups }}"

    # Keycloak has no `groups` scope of its own. This one puts the bare group
    # names in a `groups` claim — "admins", not "/admins" — which is the shape
    # Authelia's claim had and what Forgejo's admin-group mapping compares with.
    - name: Create the groups client scope
      community.general.keycloak_clientscope:
        realm: "{{ keycloak_realm }}"
        name: groups
        description: Group membership, in a `groups` claim
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocol_mappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              introspection.token.claim: "true"
        state: present

    # `basic` carries the `sub` claim since Keycloak 25: a client without it gets
    # tokens with no subject at all.
    - name: Register the OpenID Connect clients
      community.general.keycloak_client:
        realm: "{{ keycloak_realm }}"
        client_id: "{{ item.id }}"
        name: "{{ item.name }}"
        enabled: true
        protocol: openid-connect
        public_client: false
        client_authenticator_type: client-secret
        secret: "{{ item.secret }}"
        standard_flow_enabled: true
        implicit_flow_enabled: false
        direct_access_grants_enabled: false
        service_accounts_enabled: false
        consent_required: false
        frontchannel_logout: true
        redirect_uris: "{{ item.redirect_uris }}"
        web_origins: ["+"]
        # Keycloak drops an attribute set to "", so a client without PKCE gets no
        # attribute at all rather than an empty one, which would show as a change
        # on every run. The flip side: turning pkce off for a client that had it
        # means clearing the field in the console once.
        attributes: >-
          {{ {'post.logout.redirect.uris': '+'}
             | combine({'pkce.code.challenge.method': 'S256'} if item.pkce | default(true) else {}) }}
        default_client_scopes: >-
          {{ ['basic', 'acr', 'web-origins', 'roles', 'profile', 'email']
             + (['groups'] if item.groups | default(false) else []) }}
        optional_client_scopes: [offline_access]
        protocol_mappers: "{{ item.protocol_mappers | default(omit) }}"
        state: present
      loop: "{{ keycloak_oauth2_proxy_client + keycloak_oidc_clients }}"
      loop_control:
        label: "{{ item.id }}"
      vars:
        # oauth2-proxy's keycloak-oidc provider checks that the access token is
        # addressed to it, which Keycloak only does with an audience mapper.
        keycloak_oauth2_proxy_client:
          - id: oauth2-proxy
            name: oauth2-proxy
            secret: "{{ vault_oauth2_proxy_client_secret }}"
            redirect_uris: ["https://{{ keycloak_domain }}/oauth2/callback"]
            groups: true
            protocol_mappers:
              - name: audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                config:
                  included.client.audience: oauth2-proxy
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
      no_log: "{{ keycloak_no_log }}"
