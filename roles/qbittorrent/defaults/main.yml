---
# Images are pinned: a torrent client that silently changes behaviour behind a
# VPN killswitch is not something to discover after an unattended pull.
qbittorrent_gluetun_image: qmcgaw/gluetun:v3.41.3
qbittorrent_image: lscr.io/linuxserver/qbittorrent:5.2.3

# Config lives in /etc and state in /var/lib, like authelia — not under
# ~/apps with the other compose stacks. The VPN credentials are root-only, and
# compose has to be able to read them.
qbittorrent_stack_dir: /etc/qbittorrent
qbittorrent_config_dir: /var/lib/qbittorrent
qbittorrent_downloads_dir: "{{ jellyfin_media_root }}/downloads"

# The whole media tree is mounted, not just the download directory, and at the
# same path Sonarr and Radarr use. An import is then a hardlink from
# /data/downloads/complete into /data/show: no copy, no second copy of the file
# on disk, and the torrent keeps seeding from the same inode. It also means the
# save path qBittorrent reports over its API is a path the *arr containers can
# resolve, so none of them need a remote path mapping.
qbittorrent_media_mount: /data
qbittorrent_downloads_mount: "{{ qbittorrent_media_mount }}/{{ qbittorrent_downloads_dir | relpath(jellyfin_media_root) }}"

# Shared network gluetun joins alongside its own, so Sonarr and Radarr can reach
# the WebUI at gluetun:8080 without going through Caddy and Authelia.
media_network: media
media_network_subnet: 10.89.0.0/24

# Published on the loopback and proxied by Caddy, like everything else.
qbittorrent_webui_port: 8099
qbittorrent_webui_domain: ""
qbittorrent_webui_username: admin

# Le port sur lequel qBittorrent écoute les pairs, dans le tunnel. C'est aussi
# le port qu'il annonce aux trackers et au DHT.
qbittorrent_torrenting_port: 6881

# Ports que le pare-feu de gluetun accepte en entrée *sur l'interface du
# tunnel*, TCP et UDP (internal/firewall/iptables.go, acceptInputToPort pose
# une règle par protocole). gluetun laisse toujours repasser les réponses aux
# connexions que l'on ouvre — conntrack —, mais jette toute connexion entrante
# non sollicitée dont le port n'est pas dans cette liste. Sans le port de pairs
# ici, qBittorrent ne peut parler qu'aux pairs qu'il a contactés lui-même : il
# seede uniquement vers ceux qui sont joignables, et reste invisible pour le
# reste de l'essaim.
#
# Nécessaire, pas suffisant : encore faut-il qu'un paquet arrive jusqu'à cette
# règle, donc que le fournisseur redirige le port. CyberGhost ne le fait pas et
# gluetun ne sait le piloter que chez PIA, PrivateVPN et ProtonVPN. L'ouverture
# reste juste : elle ne coûte rien tant que rien n'arrive, et elle est la
# moitié qui manquerait le jour où le fournisseur change. Videz la liste pour
# refermer le port.
qbittorrent_vpn_input_ports:
  - "{{ qbittorrent_torrenting_port }}"

# CyberGhost is a provider gluetun knows natively: it holds the server list and
# the CA, so there is no .ovpn file to carry around and no hostname to resolve
# by hand. It authenticates with a username and password *plus* a client
# certificate and key — all four come from one "manual configuration" in the
# CyberGhost dashboard, and all four live in the vault. See TODO-qbittorrent.md.
qbittorrent_vpn_provider: cyberghost
qbittorrent_openvpn_protocol: udp

# Which servers gluetun is allowed to pick from. Leave both empty to let it
# choose anywhere in the world, which is rarely what you want for torrenting.
# Country names must match gluetun's own list:
#   docker run --rm qmcgaw/gluetun format-servers -cyberghost
qbittorrent_vpn_server_countries: []
qbittorrent_vpn_server_hostnames: []

# The container writes as this account, with the media group so Jellyfin can
# read what lands in the download directory.
qbittorrent_user: qbittorrent
qbittorrent_media_group: jellyfin

# qBittorrent rewrites qBittorrent.conf itself every time it exits, so the file
# is seeded once and then left alone — whatever you change in the WebUI sticks.
# Flip this to true for one run to make the template authoritative again.
#
# C'est cette réécriture-à-l'arrêt qui oblige le rôle à couper le conteneur
# avant de resemer : voir la tâche « Stop qBittorrent before reseeding ». Un
# run avec reset_config=true interrompt donc brièvement le tunnel et les
# téléchargements en cours, en plus de jeter les réglages faits dans la WebUI.
qbittorrent_reset_config: false

# How long to wait for gluetun to report healthy, i.e. for the tunnel to be up.
qbittorrent_wait_timeout: 180

jellyfin_media_root: /var/jellyfin/media
docker_publish_address: "127.0.0.1"
common_timezone: Etc/UTC
