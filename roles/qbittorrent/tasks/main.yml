---
# qBittorrent has no route to the internet of its own: it shares gluetun's
# network namespace, and gluetun's firewall drops everything that is not the
# tunnel. If the VPN goes down the client stops talking rather than falling back
# to the bare connection. That is the whole point of the arrangement, so the two
# containers are one compose project with a health condition between them —
# `docker_container` with `network_mode: container:gluetun` gives no ordering
# guarantee when gluetun is recreated.

- name: Check the vault holds the VPN credentials
  ansible.builtin.assert:
    that:
      - vault_qbittorrent_openvpn_user | default('') | length > 0
      - vault_qbittorrent_openvpn_password | default('') | length > 0
      - vault_qbittorrent_openvpn_cert | default('') | length > 0
      - vault_qbittorrent_openvpn_key | default('') | length > 0
      - vault_qbittorrent_password_pbkdf2 | default('') | length > 0
    fail_msg: >-
      Missing secrets. `ansible-vault edit group_vars/all/vault.yml` and add
      vault_qbittorrent_openvpn_user, vault_qbittorrent_openvpn_password,
      vault_qbittorrent_openvpn_cert, vault_qbittorrent_openvpn_key and
      vault_qbittorrent_password_pbkdf2. The first four all come from one
      "manual configuration" in the CyberGhost dashboard — see
      TODO-qbittorrent.md for where to click.
    quiet: true

# CyberGhost authenticates with a client certificate on top of the username and
# password, and gluetun refuses to start without both ("client certificate:
# missing value"). The secret files hold the PEM blocks verbatim: gluetun reads
# /run/secrets/openvpn_clientcrt and openvpn_clientkey through a PEM parser and
# base64s them itself, which is the one place it accepts the armour lines.
- name: Check the client certificate and key are unencrypted PEM blocks
  ansible.builtin.assert:
    that:
      - vault_qbittorrent_openvpn_cert is search('-----BEGIN CERTIFICATE-----')
      - vault_qbittorrent_openvpn_key is search('-----BEGIN (RSA |EC )?PRIVATE KEY-----')
    fail_msg: >-
      vault_qbittorrent_openvpn_cert must be the whole client.crt and
      vault_qbittorrent_openvpn_key the whole client.key, armour lines included,
      as `|` block scalars. An `ENCRYPTED PRIVATE KEY` will not do either:
      gluetun wants OPENVPN_ENCRYPTED_KEY and a passphrase for those, which
      CyberGhost never hands out.
    quiet: true

- name: Create the qbittorrent service account
  ansible.builtin.user:
    name: "{{ qbittorrent_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: "{{ qbittorrent_config_dir }}"
    groups: ["{{ qbittorrent_media_group }}"]
    append: true
  register: qbittorrent_account

- name: Read the media group
  ansible.builtin.group:
    name: "{{ qbittorrent_media_group }}"
  register: qbittorrent_media_group_state

- name: Ensure the qbittorrent directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ qbittorrent_stack_dir }}"
      mode: "0750"
    - path: "{{ qbittorrent_stack_dir }}/secrets"
      mode: "0700"
    - path: "{{ qbittorrent_config_dir }}"
      owner: "{{ qbittorrent_user }}"
      group: "{{ qbittorrent_media_group }}"
      mode: "0750"
    - path: "{{ qbittorrent_config_dir }}/qBittorrent"
      owner: "{{ qbittorrent_user }}"
      group: "{{ qbittorrent_media_group }}"
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"

# setgid so everything the client writes keeps the media group, and Jellyfin
# reads finished downloads without a copy or a chown pass.
- name: Prepare the download directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ qbittorrent_user }}"
    group: "{{ qbittorrent_media_group }}"
    mode: "2775"
  loop:
    - "{{ qbittorrent_downloads_dir }}"
    - "{{ qbittorrent_downloads_dir }}/incomplete"
    - "{{ qbittorrent_downloads_dir }}/complete"

# Left over from the custom-provider arrangement, before gluetun was told the
# provider is CyberGhost and started supplying the server list and the CA
# itself. It is a file full of credentials, so it does not just get orphaned.
- name: Remove the custom OpenVPN configuration
  ansible.builtin.file:
    path: "{{ qbittorrent_stack_dir }}/custom.ovpn"
    state: absent

# Passed as compose secrets rather than environment variables so they stay out
# of `docker inspect` and the container's /proc/1/environ. The file names are
# gluetun's own: it looks for /run/secrets/<name> for each of these.
- name: Deploy the OpenVPN credentials
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ qbittorrent_stack_dir }}/secrets/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: openvpn_user
      value: "{{ vault_qbittorrent_openvpn_user }}"
    - name: openvpn_password
      value: "{{ vault_qbittorrent_openvpn_password }}"
    - name: openvpn_clientcrt
      value: "{{ vault_qbittorrent_openvpn_cert }}"
    - name: openvpn_clientkey
      value: "{{ vault_qbittorrent_openvpn_key }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  register: qbittorrent_secrets_state

# Seeded, not managed: see qbittorrent_reset_config in the role defaults.
- name: Seed the qBittorrent configuration
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "{{ qbittorrent_config_dir }}/qBittorrent/qBittorrent.conf"
    owner: "{{ qbittorrent_user }}"
    group: "{{ qbittorrent_media_group }}"
    mode: "0600"
    force: "{{ qbittorrent_reset_config }}"
  no_log: true
  register: qbittorrent_config_state

- name: Deploy the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ qbittorrent_stack_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"
  register: qbittorrent_compose_state

- name: Bring the qbittorrent stack up
  community.docker.docker_compose_v2:
    project_src: "{{ qbittorrent_stack_dir }}"
    files: [compose.yml]
    state: present
    # Fail loudly if the tunnel never comes up, rather than hanging forever on
    # bad credentials — gluetun retries the connection indefinitely on its own.
    wait: true
    wait_timeout: "{{ qbittorrent_wait_timeout }}"
    recreate: >-
      {{ 'always' if (qbittorrent_compose_state.changed
                      or qbittorrent_secrets_state.changed
                      or qbittorrent_config_state.changed) else 'auto' }}
