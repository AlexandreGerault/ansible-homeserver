---
docker_users: []
docker_daemon_options: {}
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Networks that outlive any single compose project. See media_network in
# group_vars for why the media stack shares one.
docker_networks:
  - name: "{{ media_network }}"
    subnet: "{{ media_network_subnet }}"
media_network: media
media_network_subnet: 10.89.0.0/24
