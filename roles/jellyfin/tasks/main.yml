---
- name: Create the jellyfin group
  ansible.builtin.group:
    name: jellyfin

- name: Create the jellyfin service account
  ansible.builtin.user:
    name: jellyfin
    groups: [jellyfin, docker]
    append: true

- name: Add the users allowed to manage the media library
  ansible.builtin.user:
    name: "{{ item }}"
    groups: jellyfin
    append: true
  loop: "{{ jellyfin_users }}"

- name: Prepare the media root
  ansible.builtin.file:
    path: "{{ jellyfin_media_root }}"
    state: directory
    owner: root
    group: jellyfin
    mode: "0750"

# setgid: Sonarr and Radarr create the series and film directories in here as
# the `arr` account, whose primary group is not jellyfin. Without the bit those
# directories come out arr:arr and Jellyfin cannot descend into them.
- name: Prepare the media libraries
  ansible.builtin.file:
    path: "{{ jellyfin_media_root }}/{{ item }}"
    state: directory
    owner: root
    group: jellyfin
    mode: "2770"
  loop: "{{ jellyfin_media_libraries }}"

# The container currently runs as root. Dropping it to the jellyfin account is
# tracked as plan B5: it requires chowning the config and cache volumes first.
#
# Host networking published 8096 on every interface, bypassing both UFW and
# Caddy. Bridge networking with a loopback binding keeps the reverse proxy as
# the only way in. The cost is DLNA and client auto-discovery on the LAN, which
# need the host network stack; set jellyfin_network_mode back to `host` if you
# ever want them.
#
# It sits on the shared media network rather than the default bridge so
# Jellyseerr and the Homepage widget can call http://jellyfin:8096 directly.
# Going round through Caddy would work for Jellyfin, but not for anything behind
# the SSO, so the whole stack uses container names consistently.
- name: Run the Jellyfin container
  community.docker.docker_container:
    name: jellyfin
    image: "{{ jellyfin_image }}"
    network_mode: "{{ jellyfin_network_mode }}"
    ports: "{{ [docker_publish_address ~ ':8096:8096'] if jellyfin_network_mode != 'host' else omit }}"
    state: started
    restart_policy: always
    mounts:
      - type: bind
        source: "{{ jellyfin_media_root }}"
        target: /media
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
