---
- name: Harden the sshd configuration
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: sshd -t -f %s
  loop:
    - regexp: "^#?PermitRootLogin"
      line: "PermitRootLogin no"
    - regexp: "^#?PasswordAuthentication"
      line: "PasswordAuthentication no"
    - regexp: "^#?KbdInteractiveAuthentication"
      line: "KbdInteractiveAuthentication no"
    - regexp: "^#?Port "
      line: "Port {{ ssh_port }}"
    - regexp: "^#?AllowUsers"
      line: "AllowUsers {{ (authorized_users + ssh_extra_allowed_users) | join(' ') }}"
  loop_control:
    label: "{{ item.line }}"
  notify: Restart ssh

- name: Ensure the .ssh directory exists for the authorized users
  ansible.builtin.file:
    path: "/home/{{ item }}/.ssh"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: "{{ authorized_users }}"

- name: Deploy the authorized_keys files
  ansible.builtin.copy:
    content: '{{ vault_ssh_authorized_keys[item] | join("\n") }}{{ "\n" }}'
    dest: "/home/{{ item }}/.ssh/authorized_keys"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0600"
  loop: "{{ authorized_users }}"

- name: Install fail2ban and UFW
  ansible.builtin.apt:
    name:
      - fail2ban
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable UFW with a deny-by-default policy
  community.general.ufw:
    state: enabled
    policy: deny

- name: Open the public ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ssh_open_ports }}"
