---
- name: Harden the sshd configuration
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: sshd -t -f %s
  loop:
    - regexp: "^#?PermitRootLogin"
      line: "PermitRootLogin no"
    - regexp: "^#?PasswordAuthentication"
      line: "PasswordAuthentication no"
    - regexp: "^#?KbdInteractiveAuthentication"
      line: "KbdInteractiveAuthentication no"
    - regexp: "^#?Port "
      line: "Port {{ ssh_port }}"
    - regexp: "^#?AllowUsers"
      line: "AllowUsers {{ (authorized_users + ssh_extra_allowed_users) | join(' ') }}"
  loop_control:
    label: "{{ item.line }}"
  notify: Restart ssh

- name: Ensure the .ssh directory exists for the authorized users
  ansible.builtin.file:
    path: "/home/{{ item }}/.ssh"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: "{{ authorized_users }}"

# Rendered from a template rather than an inline `content:` string. Building the
# file with join() inside a YAML scalar put literal backslash-n sequences in it,
# which sshd reads as one malformed key — with PasswordAuthentication off, that
# locks everyone out.
- name: Deploy the authorized_keys files
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "/home/{{ user }}/.ssh/authorized_keys"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0600"
  loop: "{{ authorized_users }}"
  loop_control:
    loop_var: user

- name: Install fail2ban and UFW
  ansible.builtin.apt:
    name:
      - fail2ban
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the fail2ban jails
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Open the public ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ssh_open_ports }}"

- name: Enable UFW with a deny-by-default policy
  community.general.ufw:
    state: enabled
    policy: deny
