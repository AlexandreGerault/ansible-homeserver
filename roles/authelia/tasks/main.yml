---
# Authelia had never started: its two configuration files were the untouched
# 71KB upstream template, so every mandatory section was missing, and the
# container published 9091 while the Caddy vhost proxied to 8098.

- name: Check the vault holds the OpenID Connect secrets
  ansible.builtin.assert:
    that:
      - vault_authelia_oidc_hmac_secret | default('') | length >= 32
      - vault_authelia_oidc_jwk | default('') is search('PRIVATE KEY')
      - authelia_oidc_clients | map(attribute='secret_digest', default='')
        | select | length == authelia_oidc_clients | length
    fail_msg: >-
      authelia_oidc_clients is not empty, so the provider needs its own two
      secrets in group_vars/all/vault.yml: vault_authelia_oidc_hmac_secret, and
      vault_authelia_oidc_jwk, an RSA private key as a PEM block scalar from
      `authelia crypto pair rsa generate`. Every client also needs a
      secret_digest. See the README.
    quiet: true
  when: authelia_oidc_clients | length > 0

- name: Check the vault holds the SMTP password
  ansible.builtin.assert:
    that:
      - vault_smtp_password | default('') | length > 0
    fail_msg: >-
      smtp_host is set, so the notifier needs vault_smtp_password in
      group_vars/all/vault.yml.
    quiet: true
  when: smtp_host | length > 0

- name: Ensure the authelia directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ authelia_config_dir }}"
      mode: "0755"
    - path: "{{ authelia_config_dir }}/secrets"
      mode: "0700"
    - path: "{{ authelia_data_dir }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Deploy the authelia secrets
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ authelia_config_dir }}/secrets/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: JWT_SECRET
      value: "{{ vault_authelia_jwt_secret }}"
    - name: SESSION_SECRET
      value: "{{ vault_authelia_session_secret }}"
    - name: STORAGE_ENCRYPTION_KEY
      value: "{{ vault_authelia_storage_encryption_key }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart authelia

# Only when a client is configured. The HMAC secret signs the OpenID Connect
# tokens; the PEM is the RSA private key the ID tokens are signed with, and
# rotating it invalidates every session and every authorization code in flight.
# Both are deployed apart from the three above because Authelia refuses to start
# when AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE points at nothing.
- name: Deploy the OpenID Connect secrets
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ authelia_config_dir }}/secrets/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: OIDC_HMAC_SECRET
      value: "{{ vault_authelia_oidc_hmac_secret | default('') }}"
    - name: OIDC_JWK
      value: "{{ vault_authelia_oidc_jwk | default('') }}"
  loop_control:
    label: "{{ item.name }}"
  when: authelia_oidc_clients | length > 0
  no_log: true
  notify: Restart authelia

- name: Deploy the SMTP password
  ansible.builtin.copy:
    content: "{{ vault_smtp_password }}"
    dest: "{{ authelia_config_dir }}/secrets/SMTP_PASSWORD"
    owner: root
    group: root
    mode: "0600"
  when: smtp_host | length > 0
  no_log: true
  notify: Restart authelia

- name: Deploy the authelia configuration
  ansible.builtin.template:
    src: configuration.yml.j2
    dest: "{{ authelia_config_dir }}/configuration.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart authelia

- name: Deploy the users database
  ansible.builtin.template:
    src: users_database.yml.j2
    dest: "{{ authelia_config_dir }}/users_database.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart authelia

- name: Run the authelia container
  community.docker.docker_container:
    name: authelia
    image: "{{ authelia_image }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ docker_publish_address }}:{{ authelia_port }}:9091"
    env: >-
      {{ authelia_base_env
         | combine({'AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE':
                    '/secrets/OIDC_HMAC_SECRET'}
                   if authelia_oidc_clients | length > 0 else {})
         | combine({'AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE': '/secrets/SMTP_PASSWORD'}
                   if smtp_host | length > 0 else {}) }}
    mounts:
      - type: bind
        source: "{{ authelia_config_dir }}/configuration.yml"
        target: /config/configuration.yml
        read_only: true
      - type: bind
        source: "{{ authelia_config_dir }}/users_database.yml"
        target: /config/users_database.yml
        read_only: true
      - type: bind
        source: "{{ authelia_config_dir }}/secrets"
        target: /secrets
        read_only: true
      - type: bind
        source: "{{ authelia_data_dir }}"
        target: /data
