[defaults]
inventory = inventory.yml
roles_path = roles
vault_password_file = ~/.ansible/vault-pass
host_key_checking = True
# The homepage background image is a 7MB transfer; the default 10s timeout
# expires while waiting for the escalation prompt on a saturated link.
timeout = 60
stdout_callback = default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto_silent
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
# The sudo password is ansible_become_password, in the vault.
become_ask_pass = False

[ssh_connection]
pipelining = True
