---
- name: Configure the homeserver
  hosts: homeservers
  become: true

  roles:
    - role: common
      tags: [common]
    - role: ssh
      tags: [ssh]
    - role: docker
      tags: [docker]
    - role: caddy
      tags: [caddy]
    - role: authelia
      tags: [authelia, apps]
    - role: jellyfin
      tags: [jellyfin, apps]
    # After jellyfin: it writes into the media tree and joins the jellyfin group.
    - role: qbittorrent
      tags: [qbittorrent, apps]
    # After qbittorrent: Sonarr and Radarr are wired to the download client at
    # gluetun's name, which has to exist on the media network first.
    - role: arr_stack
      tags: [arr, apps]
    # After authelia: the role waits for Forgejo to answer and then registers
    # Authelia as its authentication source, so the provider has to exist first.
    - role: forgejo
      tags: [forgejo, apps]
    - role: homepage
      tags: [homepage, apps]
    - role: arbitrage_ffv
      tags: [arbitrage_ffv, apps]

  tasks:
    - name: Deploy the docker compose applications
      ansible.builtin.include_role:
        name: compose_app
      vars:
        compose_app: "{{ stack }}"
      loop: "{{ compose_apps }}"
      loop_control:
        loop_var: stack
        label: "{{ stack.name }}"
      tags: [compose, apps]
