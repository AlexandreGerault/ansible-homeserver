---
- name: Configure the homeserver
  hosts: homeservers
  become: true

  roles:
    - role: common
      tags: [common]
    - role: ssh
      tags: [ssh]
    - role: docker
      tags: [docker]
    - role: caddy
      tags: [caddy]
    - role: jellyfin
      tags: [jellyfin, apps]
    - role: homepage
      tags: [homepage, apps]
    - role: arbitrage_ffv
      tags: [arbitrage_ffv, apps]

  tasks:
    - name: Deploy the docker compose applications
      ansible.builtin.include_role:
        name: compose_app
      vars:
        compose_app: "{{ stack }}"
      loop: "{{ compose_apps }}"
      loop_control:
        loop_var: stack
        label: "{{ stack.name }}"
      tags: [compose, apps]
