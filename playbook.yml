---
- name: Configure the homeserver
  hosts: homeservers
  become: true

  roles:
    - role: common
      tags: [common]
    - role: ssh
      tags: [ssh]
    - role: docker
      tags: [docker]
    - role: caddy
      tags: [caddy]
    # Before forgejo and the compose apps, which log in through it. It also
    # takes Authelia's accounts over and removes its container, once.
    - role: keycloak
      tags: [keycloak, apps]
    - role: jellyfin
      tags: [jellyfin, apps]
    # After jellyfin: it writes into the media tree and joins the jellyfin group.
    - role: qbittorrent
      tags: [qbittorrent, apps]
    # After qbittorrent: Sonarr and Radarr are wired to the download client at
    # gluetun's name, which has to exist on the media network first.
    - role: arr_stack
      tags: [arr, apps]
    # After keycloak: the role waits for Forgejo to answer and then registers
    # Keycloak as its authentication source, so the provider has to exist first.
    - role: forgejo
      tags: [forgejo, apps]
    # After forgejo: the runner registers through the forgejo container's CLI,
    # and polls a forge that has to have Actions enabled already.
    - role: forgejo_runner
      tags: [forgejo_runner, apps]
    # After keycloak, which registers its OpenID Connect client, and after
    # forgejo, whose registry the image comes from.
    - role: job_applications
      tags: [job_applications, apps]
    - role: homepage
      tags: [homepage, apps]
    - role: arbitrage_ffv
      tags: [arbitrage_ffv, apps]

  tasks:
    # include_role is dynamic: the tags below select the include itself, not the
    # tasks it pulls in, so without `apply` a `--tags compose` run includes the
    # role and then skips every one of its tasks.
    - name: Deploy the docker compose applications
      ansible.builtin.include_role:
        name: compose_app
        apply:
          tags: [compose, apps]
      vars:
        compose_app: "{{ stack }}"
      loop: "{{ compose_apps }}"
      loop_control:
        loop_var: stack
        label: "{{ stack.name }}"
      tags: [compose, apps]
